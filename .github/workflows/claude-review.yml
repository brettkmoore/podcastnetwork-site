# Claude reviews each pull request once when opened (and when marked ready).
# Read-only: it can read the diff and comment, nothing else.
# Needs the ANTHROPIC_API_KEY repo secret; skips cleanly without it.
# Expected usage: about 2 to 5 Actions minutes per review, plus API usage.
name: claude-review
on:
  pull_request:
    types: [opened, ready_for_review]
permissions:
  contents: read
  pull-requests: write
  id-token: write
jobs:
  review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check for key
        id: key
        env:
          K: ${{ secrets.ANTHROPIC_API_KEY }}
        run: if [ -n "$K" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ANTHROPIC_API_KEY not set; skipping review."; fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == 'true'
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        if: steps.key.outputs.ok == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_sticky_comment: true
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }} with a fresh eye.
            Report only real bugs, broken builds, security problems, and violations of CLAUDE.md, including its review policy.
            Say whether the change is copy/content only or touches product, pricing or checkout.
            Keep it short. Post one summary comment; use inline comments only for specific lines.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Read,Grep,Glob"
            --disallowedTools "Edit,Write,Bash(git push:*),Bash(gh pr merge:*),Bash(gh pr close:*),Bash(gh api:*),WebFetch"
