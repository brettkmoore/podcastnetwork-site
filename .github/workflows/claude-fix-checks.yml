# When the checks workflow fails on a pull request branch, Claude tries one fix
# and pushes it to that branch. It never touches the default branch, never
# force-pushes and never merges. Runs at most once per failing commit.
# Needs the ANTHROPIC_API_KEY repo secret; skips cleanly without it.
# Expected usage: only on failures, about 3 to 8 Actions minutes each, plus API usage.
name: claude-fix-checks
on:
  workflow_run:
    workflows: [checks]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  actions: read
  id-token: write
jobs:
  fix:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch != github.event.repository.default_branch &&
      !contains(github.event.workflow_run.head_commit.message, '[claude-fix]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check for key
        id: key
        env:
          K: ${{ secrets.ANTHROPIC_API_KEY }}
        run: if [ -n "$K" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ANTHROPIC_API_KEY not set; skipping fix."; fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
      - uses: pnpm/action-setup@v4
        if: steps.key.outputs.ok == 'true'
        with:
          version: 9
      - uses: actions/setup-node@v4
        if: steps.key.outputs.ok == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.key.outputs.ok == 'true'
      - uses: anthropics/claude-code-action@v1
        if: steps.key.outputs.ok == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            The "checks" workflow failed on branch ${{ github.event.workflow_run.head_branch }} (run ${{ github.event.workflow_run.html_url }}).
            Read the failed job log with gh run view ${{ github.event.workflow_run.id }} --log-failed.
            Fix the cause in the code, run the same check locally until it passes, then commit with a message
            ending in [claude-fix] and push to ${{ github.event.workflow_run.head_branch }}.
            If the fix would change product, pricing or checkout behavior, do not push; comment on the pull request instead.
          claude_args: >-
            --allowedTools "Edit,Write,Read,Grep,Glob,Bash(pnpm *),Bash(npx tsc *),Bash(gh run view:*),Bash(gh pr comment:*),Bash(git add:*),Bash(git commit:*),Bash(git status:*),Bash(git diff:*),Bash(git push origin HEAD:${{ github.event.workflow_run.head_branch }})"
            --disallowedTools "Bash(git push --force*),Bash(git push -f*),Bash(git push origin main*),Bash(git push origin HEAD:main*),Bash(gh pr merge:*),Bash(gh api:*),Bash(curl:*),WebFetch"
